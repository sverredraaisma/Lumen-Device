[package]
name = "lumen-device"
description = "Mesh state machines: discovery, time sync, election, replication, source stack, render loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# Path rather than a version: nothing is on crates.io yet and there is no git
# remote. This is the layout lumen-dev/scripts/clone-all.sh produces.
# TODO(release): becomes `lumen-proto = "0.1"` at the first lumen-core release.
lumen-proto = { version = "0.1.0", path = "../../../lumen-core/crates/lumen-proto" }
# Zone predicates and the render loop both work in Q16 and run bytecode, so the
# VM is a dependency of the device rather than only of the shell around it.
lumen-vm = { version = "0.1.0", path = "../../../lumen-core/crates/lumen-vm", default-features = false }

[dev-dependencies]
# The render tests assemble programs, which needs the VM builder that firmware
# builds turn off.
lumen-vm = { version = "0.1.0", path = "../../../lumen-core/crates/lumen-vm" }
