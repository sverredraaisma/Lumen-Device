name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  COVERAGE_FLOOR: 95

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-device
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen-device
      # TODO(release): delete this step once `lumen-hal` is on crates.io and the
      # workspace dependency in Cargo.toml reverts to a plain version. Until
      # then the sim's HAL traits come from the sibling checkout that
      # `lumen-dev/scripts/clone-all.sh` produces locally, and CI has to
      # reproduce that layout by hand — a bare checkout only gets this repo, so
      # `../lumen-core/crates/lumen-hal` would not exist and every job would
      # fail at manifest parse rather than at anything interesting.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `defaults.run.working-directory` does not reach actions, only `run`
      # steps, so the cache has to be pointed at the workspace explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-device
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  conformance:
    name: behavioural conformance vectors
    runs-on: ubuntu-latest
    steps:
      # Three checkouts: this repo, lumen-core for the codec the state machines
      # speak, and lumen-spec for the vectors and the runner. That is the whole
      # point of the job — the vectors are normative and live in another repo,
      # so nothing here can quietly change what conformance means.
      - uses: actions/checkout@v4
        with:
          path: lumen-device
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Spec
          path: lumen-spec
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-device/adapters/conformance
      # The adapter is outside the workspace, so the fmt and clippy job above
      # never sees it. Held to the same bar here rather than left as the one
      # unchecked crate in the repo.
      - name: the adapter is formatted and lint-clean
        working-directory: lumen-device/adapters/conformance
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: build the adapter
        working-directory: lumen-device/adapters/conformance
        run: cargo build --release
      # Runs every behavioural vector against the real state machines. Before
      # this job existed the suite only ever ran against the reference fixture,
      # which answers from the corpus and so passed by construction: twelve
      # vectors that could not fail.
      - name: run the vectors against the real implementation
        working-directory: lumen-spec
        run: |
          adapter="../lumen-device/adapters/conformance/target/release/lumen-device-adapter"
          cargo run --release --bin lumen-conformance -- --adapter "$adapter" vectors/behavioural/

  coverage:
    name: coverage >= 95%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-device
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen-device
      # TODO(release): delete this step once `lumen-hal` is on crates.io and the
      # workspace dependency in Cargo.toml reverts to a plain version. Until
      # then the sim's HAL traits come from the sibling checkout that
      # `lumen-dev/scripts/clone-all.sh` produces locally, and CI has to
      # reproduce that layout by hand — a bare checkout only gets this repo, so
      # `../lumen-core/crates/lumen-hal` would not exist and every job would
      # fail at manifest parse rather than at anything interesting.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # `defaults.run.working-directory` does not reach actions, only `run`
      # steps, so the cache has to be pointed at the workspace explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-device
      - uses: taiki-e/install-action@cargo-llvm-cov
      # --fail-under-lines is the gate. Keep it in CI rather than in a local
      # script: this is the number that decides whether a change is finished.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines ${{ env.COVERAGE_FLOOR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lumen-device/lcov.info
