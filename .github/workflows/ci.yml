name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  COVERAGE_FLOOR: 95

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-device
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen-device
      # TODO(release): delete this step once `lumen-hal` is on crates.io and the
      # workspace dependency in Cargo.toml reverts to a plain version. Until
      # then the sim's HAL traits come from the sibling checkout that
      # `lumen-dev/scripts/clone-all.sh` produces locally, and CI has to
      # reproduce that layout by hand — a bare checkout only gets this repo, so
      # `../lumen-core/crates/lumen-hal` would not exist and every job would
      # fail at manifest parse rather than at anything interesting.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `defaults.run.working-directory` does not reach actions, only `run`
      # steps, so the cache has to be pointed at the workspace explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-device
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  coverage:
    name: coverage >= 95%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-device
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen-device
      # TODO(release): delete this step once `lumen-hal` is on crates.io and the
      # workspace dependency in Cargo.toml reverts to a plain version. Until
      # then the sim's HAL traits come from the sibling checkout that
      # `lumen-dev/scripts/clone-all.sh` produces locally, and CI has to
      # reproduce that layout by hand — a bare checkout only gets this repo, so
      # `../lumen-core/crates/lumen-hal` would not exist and every job would
      # fail at manifest parse rather than at anything interesting.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # `defaults.run.working-directory` does not reach actions, only `run`
      # steps, so the cache has to be pointed at the workspace explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-device
      - uses: taiki-e/install-action@cargo-llvm-cov
      # --fail-under-lines is the gate. Keep it in CI rather than in a local
      # script: this is the number that decides whether a change is finished.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines ${{ env.COVERAGE_FLOOR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lumen-device/lcov.info
